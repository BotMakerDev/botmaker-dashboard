<!--
  BotMaker Dashboard's icon: the release board, which is what this window is.

  Same family as botmaker-studio's icon — the squircle, the corner radius, the palette — and deliberately
  NOT the same mark: the two sit next to each other in an application menu and in a taskbar, so they have
  to be told apart at 16px. Studio's is the robot; this is three release lanes, each a row of step nodes
  with the connector between them, in the three states a lane can be in: done, running, waiting. That is
  literally what ModuleLane draws.

  The background runs teal → deep purple rather than Studio's purple → deep purple, which is the accent
  that separates them at a glance before any shape is legible.
-->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E9C8E"/>
      <stop offset="100%" stop-color="#241B3A"/>
    </linearGradient>
    <linearGradient id="okNode" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7BE5D3"/>
      <stop offset="100%" stop-color="#2E9C8E"/>
    </linearGradient>
    <linearGradient id="runNode" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC163"/>
      <stop offset="100%" stop-color="#FF9F45"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#140B24" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background squircle, Studio's geometry exactly: the two are one product. -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>

  <g filter="url(#softShadow)">
    <!-- The board the lanes sit on. -->
    <rect x="86" y="120" width="340" height="272" rx="28" fill="#FFFFFF" opacity="0.95"/>

    <!-- Lane 1 — done: three filled nodes, both connectors filled. -->
    <rect x="120" y="164" width="60" height="12" rx="6" fill="#241B3A" opacity="0.35"/>
    <rect x="206" y="176" width="42" height="8" rx="4" fill="#2E9C8E"/>
    <rect x="286" y="176" width="42" height="8" rx="4" fill="#2E9C8E"/>
    <circle cx="192" cy="180" r="14" fill="url(#okNode)"/>
    <circle cx="272" cy="180" r="14" fill="url(#okNode)"/>
    <circle cx="352" cy="180" r="14" fill="url(#okNode)"/>

    <!-- Lane 2 — running: two done, the third amber with its pulse ring, last connector unfilled. -->
    <rect x="120" y="240" width="60" height="12" rx="6" fill="#241B3A" opacity="0.35"/>
    <rect x="206" y="252" width="42" height="8" rx="4" fill="#2E9C8E"/>
    <rect x="286" y="252" width="42" height="8" rx="4" fill="#241B3A" opacity="0.18"/>
    <circle cx="192" cy="256" r="14" fill="url(#okNode)"/>
    <circle cx="272" cy="256" r="14" fill="url(#okNode)"/>
    <circle cx="352" cy="256" r="22" fill="none" stroke="#FF9F45" stroke-width="4" opacity="0.55"/>
    <circle cx="352" cy="256" r="14" fill="url(#runNode)"/>

    <!-- Lane 3 — waiting: one done, two hollow. -->
    <rect x="120" y="316" width="60" height="12" rx="6" fill="#241B3A" opacity="0.35"/>
    <rect x="206" y="328" width="42" height="8" rx="4" fill="#241B3A" opacity="0.18"/>
    <rect x="286" y="328" width="42" height="8" rx="4" fill="#241B3A" opacity="0.18"/>
    <circle cx="192" cy="332" r="14" fill="url(#okNode)"/>
    <circle cx="272" cy="332" r="14" fill="none" stroke="#241B3A" stroke-opacity="0.3" stroke-width="4"/>
    <circle cx="352" cy="332" r="14" fill="none" stroke="#241B3A" stroke-opacity="0.3" stroke-width="4"/>
  </g>

  <!-- The tag being cut: Studio's orange, the one colour both icons share as an accent. -->
  <circle cx="404" cy="112" r="34" fill="#241B3A"/>
  <circle cx="404" cy="112" r="26" fill="url(#runNode)"/>
  <circle cx="404" cy="112" r="9" fill="#241B3A" opacity="0.65"/>
</svg>
